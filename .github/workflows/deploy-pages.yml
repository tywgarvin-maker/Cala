name: Publish Cala to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'Cala_GitHub_Pages_Ready.zip'
      - 'index.html'
      - 'cala.js'
      - 'blocks.js'
      - 'painting.js'
      - 'emergent.js'
      - 'showcase.js'
      - 'organic.js'
      - 'foundation-flat.js'
      - 'house-art.js'
      - 'house-art-v2.js'
      - 'art/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cala-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      # Deploy from the complete uploaded Cala bundle until editable source is promoted.
      - name: Prepare Cala website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f index.html ] && [ -f cala.js ]; then
            # Once unzipped source has been committed, prefer those files.
            cp index.html cala.js blocks.js painting.js emergent.js _site/
            if [ -d art ]; then cp -a art _site/art; fi
          elif [ -f Cala_GitHub_Pages_Ready.zip ]; then
            unzip -q Cala_GitHub_Pages_Ready.zip -d extracted
            if [ -f extracted/Cala_GitHub_Pages_Ready/index.html ]; then
              cp -a extracted/Cala_GitHub_Pages_Ready/. _site/
            elif [ -f extracted/index.html ]; then
              cp -a extracted/. _site/
            else
              echo 'Cannot locate index.html in Cala ZIP' >&2
              exit 1
            fi
          else
            echo 'Upload Cala_GitHub_Pages_Ready.zip to publish Cala.' >&2
            exit 1
          fi
          # A small, editable overlay replaces the strict pattern detector.
          if [ -f organic.js ]; then
            cp organic.js _site/organic.js
            python3 - <<'PY'
          from pathlib import Path
          page=Path('_site/index.html')
          text=page.read_text()
          if 'src="organic.js"' not in text:
              text=text.replace('</body>', '<script src="organic.js"></script><script>refreshRomanSpaces();draw();</script></body>')
              page.write_text(text)
          PY
          fi
          # First-visit showcase is injected after the original startup script.
          if [ -f showcase.js ]; then
            cp showcase.js _site/showcase.js
            python3 - <<'PY'
          from pathlib import Path
          page=Path('_site/index.html')
          text=page.read_text()
          if 'src="showcase.js"' not in text:
              text=text.replace('</body>', '<script src="showcase.js"></script></body>')
              page.write_text(text)
          PY
          fi
          # Apply a level construction plane without discarding the painted coast.
          if [ -f foundation-flat.js ]; then
            cp foundation-flat.js _site/foundation-flat.js
            python3 - <<'PY'
          from pathlib import Path
          page=Path('_site/index.html')
          text=page.read_text()
          if 'src="foundation-flat.js"' not in text:
              text=text.replace('</body>', '<script src="foundation-flat.js"></script></body>')
              page.write_text(text)
          PY
          fi
          # House art is a reversible rendering layer; it does not change save data.
          if [ -f house-art.js ]; then
            cp house-art.js _site/house-art.js
            python3 - <<'PY'
          from pathlib import Path
          page=Path('_site/index.html')
          text=page.read_text()
          if 'src="house-art.js"' not in text:
              text=text.replace('</body>', '<script src="house-art.js"></script></body>')
              page.write_text(text)
          PY
          fi
          # More authored Roman buildings, loaded after first-pass artwork.
          if [ -f house-art-v2.js ]; then
            cp house-art-v2.js _site/house-art-v2.js
            python3 - <<'PY'
          from pathlib import Path
          page=Path('_site/index.html')
          text=page.read_text()
          if 'src="house-art-v2.js"' not in text:
              text=text.replace('</body>', '<script src="house-art-v2.js"></script></body>')
              page.write_text(text)
          PY
          fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/cala.js
          # Fail the publish if the architecture renderer is syntactically invalid.
          if [ -f _site/house-art-v2.js ]; then node --check _site/house-art-v2.js; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
